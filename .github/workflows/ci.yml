name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test

    - name: Build project
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  staging-deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: staging

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Deploy to Vercel (Staging)
      id: vercel-staging
      uses: vercel/action@v1
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
        vercel-args: '--prod=false'

    - name: Check deployment status
      if: failure()
      run: echo "Staging deployment failed"

    - name: Alert on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Staging Deployment Failed',
            body: `Deployment failed for PR #${context.issue.number}. Check the workflow run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
            labels: ['deployment-failure']
          });

  production-deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    outputs:
      deployment-url: ${{ steps.vercel-production.outputs.deployment-url }}

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Deploy to Vercel (Production)
      id: vercel-production
      uses: vercel/action@v1
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PRODUCTION_PROJECT_ID }}
        vercel-args: '--prod=true'

    - name: Check deployment status
      run: |
        if [ "${{ steps.vercel-production.outputs.deployment-url }}" == "" ]; then
          echo "Production deployment failed - no URL returned"
          exit 1
        fi
        echo "Production deployment successful: ${{ steps.vercel-production.outputs.deployment-url }}"

    - name: Alert on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Production Deployment Failed',
            body: `Production deployment failed. Check the workflow run: ${context.payload.repository.html_url}/actions/runs/${context.runId}`,
            labels: ['deployment-failure', 'urgent']
          });

  docs-update:
    needs: production-deploy
    runs-on: ubuntu-latest
    if: success()

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update deployment documentation
      run: |
        echo "# Deployment History" > docs/deployment-history.md
        echo "" >> docs/deployment-history.md
        echo "## Latest Production Deployment" >> docs/deployment-history.md
        echo "- Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> docs/deployment-history.md
        echo "- Commit: ${{ github.sha }}" >> docs/deployment-history.md
        echo "- URL: ${{ needs.production-deploy.outputs.deployment-url }}" >> docs/deployment-history.md
        echo "- Status: Success" >> docs/deployment-history.md

    - name: Commit documentation update
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: update deployment history [skip ci]"
        file_pattern: docs/deployment-history.md
